<style>
/* Layout : écran de jeu vertical, une colonne de 460px max ; cartes façon trading card japonaise, art en trame de manga + kanji du monde */
:root{

  --f-display:'Unbounded','Dela Gothic One','Arial Black',sans-serif;
  --f-body:'Manrope','Zen Kaku Gothic New',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}

/* top bar */
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);background:var(--bg)}

.mute svg{width:18px;height:18px}
.coins{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);padding:5px 11px 5px 7px;border-radius:999px}

.small{font-size:13px}

/* bottom nav */
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--bg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:10px;font-weight:900;font-size:14px;background:var(--surface-2);border:1px solid var(--line);transition:transform .1s}

.btn.ghost{background:none}
.btn.wide{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ---------- carte ---------- */
.cw{position:relative;display:block;width:100%;padding:0;border:0;background:none;font:inherit;color:inherit}
.card{position:relative;width:100%;aspect-ratio:5/7;container-type:inline-size;perspective:900px}

.card .face.front{transition:visibility 0s .27s}.card.flipped .face.front{visibility:hidden}

.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6cqw;overflow:hidden;border:2.4cqw solid var(--rc);background:var(--surface-2)}

.r-N{--rc:var(--r-n)} .r-R{--rc:var(--r-r)} .r-SR{--rc:var(--r-sr)} .r-SSR{--rc:var(--r-ssr)} .r-UR{--rc:var(--r-ur)}
.r-UR .face{border-color:transparent;background:linear-gradient(var(--surface-2),var(--surface-2)) padding-box,linear-gradient(115deg,var(--ur-dark),var(--r-ur),var(--ssr-light),var(--r-ssr),var(--r-ur),var(--ur-dark)) border-box;background-size:auto,260% 100%;animation:foil 2.4s linear infinite}
.r-LR{--rc:var(--r-lr)}
.r-LR .face{border-color:transparent;background:linear-gradient(var(--surface-2),var(--surface-2)) padding-box,linear-gradient(100deg,#ff6b6b,#ffd166,#6bffb8,#6bc5ff,#c77dff,#ff6b6b) border-box;background-size:auto,300% 100%;animation:foil 1.8s linear infinite}
.r-LR .art::after{content:"";position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 50%,color-mix(in srgb,#fff 28%,transparent) 0 2deg,transparent 2deg 7deg)}
.r-UR .art::after{content:"";position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 50%,color-mix(in srgb,var(--r-ur) 30%,transparent) 0 2.5deg,transparent 2.5deg 8deg)}
.r-SSR .face{border-color:transparent;background:linear-gradient(var(--surface-2),var(--surface-2)) padding-box,linear-gradient(115deg,var(--ssr-dark),var(--r-ssr),var(--ssr-light),var(--r-ssr),var(--ssr-dark)) border-box;background-size:auto,260% 100%;animation:foil 3.2s linear infinite}
.r-SSR .back{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(115deg,var(--ssr-dark),var(--r-ssr),var(--ssr-light),var(--r-ssr),var(--ssr-dark)) border-box;background-size:auto,260% 100%}

.art{position:absolute;inset:0 0 32% 0;background:radial-gradient(color-mix(in srgb,var(--text) 16%,transparent) 22%,transparent 24%) 0 0/4.6cqw 4.6cqw,var(--mc);overflow:hidden}
.art.img{background-size:cover;background-position:center 15%;background-repeat:no-repeat}

.inv .m3 .pk{box-shadow:4px -4px 0 -1px color-mix(in srgb,var(--pc) 70%,var(--bg)),4px -4px 0 0 var(--bg),8px -8px 0 -1px color-mix(in srgb,var(--pc) 45%,var(--bg)),8px -8px 0 0 var(--bg)}

/* ---------- album ---------- */

.sel2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sgrid .cw{display:flex;flex-direction:column;gap:4px}.cw-pick{display:block;width:100%}.pk-th{font-size:10.5px;font-weight:700;color:var(--good);text-align:center;line-height:1.2}.pk-see{font-size:11px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:2px;padding:2px 0}.pk-tag{font-family:var(--f-mono);font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:center}.pk-tag.off{color:var(--bad)}

/* ----- Pierre d'éveil : cristal taillé ----- */
.stone{position:relative;display:inline-grid;place-items:center;width:30px;height:36px;flex:none;vertical-align:middle;filter:drop-shadow(0 0 6px color-mix(in srgb,#9B7BFF 60%,transparent))}

.awk-cost li{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.awk-cost li.ok{border-color:var(--good);color:var(--good)}

/* ----- carte éveillée : aura de braises + sceau ----- */
.card.awk .face.front{box-shadow:0 0 0 1.4cqw color-mix(in srgb,#FF7A2F 55%,transparent),0 0 9cqw color-mix(in srgb,#FF6A1F 55%,transparent);animation:awkPulse 2.4s ease-in-out infinite}
@keyframes awkPulse{50%{box-shadow:0 0 0 1.4cqw color-mix(in srgb,#FFB347 70%,transparent),0 0 14cqw color-mix(in srgb,#FF6A1F 70%,transparent)}}

.awk-embers{position:absolute;inset:0 0 32% 0;pointer-events:none;overflow:hidden;background:radial-gradient(1.2cqw 1.2cqw at 20% 110%,#FFC46B,transparent 70%),radial-gradient(1cqw 1cqw at 55% 120%,#FF8A3D,transparent 70%),radial-gradient(1.4cqw 1.4cqw at 80% 115%,#FFD68A,transparent 70%),radial-gradient(.9cqw .9cqw at 35% 130%,#FF6A1F,transparent 70%);background-repeat:no-repeat;animation:embers 2.8s linear infinite;mix-blend-mode:screen}
@keyframes embers{from{background-position:0 0,0 0,0 0,0 0}to{background-position:2cqw -95cqw,-3cqw -110cqw,1cqw -100cqw,-2cqw -120cqw}}
/* ----- cérémonie d'éveil ----- */

@keyframes hitk{0%,100%{transform:none}25%{transform:translateX(-6px) rotate(-2deg)}55%{transform:translateX(5px) rotate(1.5deg)}80%{transform:translateX(-2px)}}
.hp{height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.hp i{display:block;height:100%;background:color-mix(in srgb,var(--good) calc(var(--h)*1%),var(--bad));transition:width .45s ease-out}

.fx.slash.ltr{left:40%;transform:rotate(-35deg)}.fx.slash.rtl{right:40%;transform:rotate(35deg)}@keyframes slash{from{clip-path:inset(0 100% 0 0);opacity:1}70%{clip-path:inset(0 0 0 0);opacity:1}to{opacity:0}}

.fx.orb.ltr{left:-80%}.fx.orb.rtl{right:-80%;animation-name:orbr}@keyframes orb{to{transform:translateX(190px) scale(1.4);opacity:.3}}@keyframes orbr{to{transform:translateX(-190px) scale(1.4);opacity:.3}}
.fx.big{filter:drop-shadow(0 0 10px var(--accent))}.fx.big.punch{width:130px;height:130px;border-width:9px}.fx.big.slash{height:10px;width:200px}.fx.big.shot{height:6px}.fx.big.orb{width:40px;height:40px}

.swipe{position:relative}.fnum small{display:block;font-size:10px;letter-spacing:.1em}

.fnum.crit{color:var(--accent);font-size:22px}.fnum.spec{color:var(--r-ur);font-size:18px}.fnum.heal{color:var(--good)}
@keyframes fnum{from{transform:translateY(10px) scale(.7);opacity:0}25%{transform:translateY(0) scale(1.1);opacity:1}to{transform:translateY(-22px);opacity:0}}
.cap{margin:0;min-height:38px;font-size:13px;color:var(--muted);text-align:center}.cap b{color:var(--text)}
.sups{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sups>div{display:flex;flex-wrap:wrap;gap:4px}.sups .r{justify-content:flex-end}

[data-swipe]{touch-action:pan-y;display:block;width:100%}
.badge.nc{top:-6px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-size:8px;padding:1px 5px}
.trw{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}.trw div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:13px;border-top:1px solid var(--line)}.trw div:first-child{border-top:0}.trw span{color:var(--muted)}.trw .top{background:color-mix(in srgb,var(--accent) 12%,transparent)}.trw .top span{color:var(--text);font-weight:700}

.bracket{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.bracket div{padding:8px 4px;text-align:center;font-size:11px;font-weight:700;border-radius:8px;border:1px solid var(--line);color:var(--muted)}.bracket .won{background:color-mix(in srgb,var(--ok, #3BA776) 18%,transparent);color:var(--text)}.bracket .cur{border-color:var(--accent);color:var(--text)}

.duel.wait{opacity:.45;animation:none}.duel.wait span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}.duel.wait span:last-child{text-align:right}.duel.wait i{font-style:normal;color:var(--muted)}
.duel .dn{display:flex;flex-direction:column;min-width:0}.duel .dn b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.duel .dn small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}.duel .dn.r{text-align:right}

.bl b{display:flex;align-items:baseline;gap:6px;font-family:var(--f-mono);font-size:18px}.bl b i{font-style:normal;color:var(--muted);font-size:13px}.bl b em{font-style:normal;color:var(--accent)}.bl b em.r{color:var(--text);opacity:.7}

.sbt em{position:absolute;right:4px;top:-6px;font-style:normal;font:900 34px var(--f-display);opacity:.16}.sbt b{font:800 10.5px var(--f-display);line-height:1.15;min-height:26px;letter-spacing:-.01em}.sbt span{font:700 16px var(--f-mono)}.sbt[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 1px #fff inset}
.tw-fl{display:block;color:var(--accent);opacity:.9}
.duel.wa{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}.duel.wa .dsc b:first-child,.duel.wb .dsc b:last-child{color:var(--accent)}

/* ---------- SBC ---------- */
.sbc{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.sbc .bd{display:flex;flex-direction:column;gap:9px;min-width:0}
.sbc .ttl{font-family:var(--f-display);font-weight:900;font-size:18px;line-height:1.15}
.emb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-display);font-weight:900;font-size:24px;color:var(--text)}
.emb svg{width:40px;height:40px}
.rwl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.rwl .pk{width:22px;flex:none}
.tag-done{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--good);letter-spacing:.08em}
.tag-rep{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em}
.sbl{display:flex;flex-direction:column;gap:8px}
.sbr{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.sbr:disabled{opacity:.55}
.sbr .emb{width:40px;height:40px;font-size:17px}.sbr .emb svg{width:30px;height:30px}
.sb-b{display:flex;flex-direction:column;gap:3px;min-width:0}
.sb-b b{font-family:var(--f-display);font-weight:900;font-weight:400;font-size:15px;line-height:1.15}
.sb-b small{font-size:12px;color:var(--muted);line-height:1.3}
.sb-b .rwl{font-size:12px;margin-top:2px;gap:6px}.sb-b .rwl .pk{width:15px}.sb-b .rwl .coin{width:12px;height:12px}.sb-b .rwl .mini-emb{transform:scale(.8)}
.sp{align-self:start;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sp.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.sp.try{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.sp.done{color:var(--good);border-color:transparent}
.sbc-evt{display:flex;flex-direction:column;gap:6px;width:100%;padding:14px 16px;border-radius:14px;text-align:left;background:color-mix(in srgb,var(--p-ecl) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--p-ecl) 45%,var(--line));border-left:4px solid var(--p-ecl)}
.sbc-evt b{font-family:var(--f-display);font-weight:900;font-weight:400;font-size:20px;line-height:1.1}
.sbc-evt small{font-size:12px;color:var(--muted)}
.sbc-evt-f{display:flex;justify-content:space-between;align-items:center;gap:10px}
.conds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.conds li{display:flex;gap:9px;align-items:baseline}
.conds li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);transform:translateY(1px)}
.conds li.ok::before{background:var(--good);border-color:var(--good)}
.score{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.score>div{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.score>div+div{border-left:1px solid var(--line)}
.score .v{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.score .v small{font-size:14px;color:var(--muted)}
.pitch{display:flex;flex-direction:column;gap:12px;padding:14px 8px;border-radius:16px;background:repeating-linear-gradient(0deg,var(--surface-2) 0 38px,color-mix(in srgb,var(--surface-2) 70%,var(--bg)) 38px 76px);border:1px solid var(--line)}
.prow{display:flex;justify-content:center;gap:8px}
.slot{width:28%;max-width:92px;display:flex;flex-direction:column;align-items:center;gap:5px}
.slot .empty{width:100%;aspect-ratio:5/7;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--muted);text-align:center;line-height:1.3}
.pips{display:flex;gap:3px;height:9px;align-items:center}
.pips i{width:8px;height:8px;transform:rotate(45deg);border:1.5px solid var(--muted);border-radius:1px}
.pips i.on{background:var(--good);border-color:var(--good)}
.slot .lbl{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--muted);text-align:center;line-height:1.35}
.slot .lbl.off{color:var(--bad)}
.rule{font-size:12.5px;color:var(--muted);line-height:1.55;border-left:2px solid var(--line);padding-left:10px;margin:0}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 94%,transparent);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.sheetwrap{display:flex;align-items:flex-end;justify-content:center;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.sheet{width:100%;max-width:460px;max-height:94%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}

.sh-body{overflow-y:auto;padding-block:14px 22px;display:flex;flex-direction:column;gap:14px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:55px 1fr auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-align:left}
.row .t{min-width:0}
.row .t b{display:block;font-weight:900;font-size:14px;line-height:1.2}
.row .t span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .n{text-align:right;font-family:var(--f-display);font-weight:900;font-size:20px;line-height:1}
.row .n small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:3px}
.row .n small.off{color:var(--bad)}
.cm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.cm .card{width:min(72vw,290px)}

/* révélation */
#reveal{display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#reveal[hidden],#reward[hidden]{display:none!important}
.stage{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;user-select:none;padding-inline:16px}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--glow,var(--line)) 42%,transparent),transparent 62%);pointer-events:none}
.stage>*{position:relative}
.stage.white::after{content:"";position:absolute;inset:0;background:var(--text);animation:wflash .5s ease-out forwards;pointer-events:none}
@keyframes wflash{from{opacity:.9}to{opacity:0}}
.stage.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-3px)}}
.big-pack{position:relative;width:min(52vw,210px);animation:wiggle 1.6s ease-in-out infinite}
.big-pack .strip{position:absolute;left:0;right:0;top:0;height:14%;border-radius:8% 8% 0 0/40% 40% 0 0;background:radial-gradient(color-mix(in srgb,var(--bg) 22%,transparent) 22%,transparent 24%) 0 0/6px 6px,var(--pc);z-index:2}
.big-pack.tearing{animation:charge .55s ease-in forwards}
.big-pack.tearing .strip{animation:rip .5s .1s ease-out forwards}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-3deg)}84%{transform:rotate(3deg)}92%{transform:rotate(-1.5deg)}}
@keyframes charge{0%{transform:scale(1)}30%{transform:scale(1.04) rotate(-2deg)}60%{transform:scale(1.06) rotate(2deg)}100%{transform:scale(1.12);filter:brightness(1.6)}}
@keyframes rip{to{transform:translate(70%,-160%) rotate(28deg);opacity:0}}
.flash{width:min(70vw,280px);aspect-ratio:5/7;display:grid;place-items:center;position:relative}
.flash::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--glow) 60%,transparent) 0 6deg,transparent 6deg 18deg);border-radius:50%;animation:spin 3s linear infinite;mask:radial-gradient(circle,#000 20%,transparent 65%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%)}
.flash b{position:relative;font-family:var(--f-display);font-weight:900;font-weight:400;font-size:clamp(64px,26vw,120px);line-height:1;color:var(--glow);animation:pulse .7s ease-out}
.flash.big b{animation:pulse 1.1s cubic-bezier(.2,.9,.2,1.3)}
@keyframes spin{to{transform:rotate(360deg)}}
/* v47 : ouverture de booster — dos de carte qui monte en tension selon la rareté, puis retournement */
.tease{position:relative;z-index:0;width:min(70vw,280px);aspect-ratio:5/7;display:grid;place-items:center}
.tease .rays{position:absolute;left:-70%;top:-70%;width:240%;height:240%;z-index:-1;background:center/100% 100% no-repeat;opacity:0;will-change:transform,opacity;animation:spin 5s linear infinite,raysIn .5s .25s ease-out forwards}
.t-R .rays,.t-SR .rays{display:none}
@keyframes raysIn{to{opacity:1}}
.wpick{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);text-align:left}
.wpick-t{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}.wpick-t .eyebrow{font-size:10px}
.wpick b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rays,.sparks,.awk-rings,.awk-kj,.awk-embers,.tease,.flash{pointer-events:none}
.cback{position:relative;width:100%;height:100%;border-radius:6%;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--glow) 22%,transparent),transparent 60%),repeating-linear-gradient(45deg,#1b2033 0 7px,#151929 7px 14px);border:3px solid var(--glow);box-shadow:0 0 0 1px #000,0 0 24px color-mix(in srgb,var(--glow) 45%,transparent);animation:tIn .32s ease-out both}
.cback::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 70px 6px var(--glow);opacity:0;pointer-events:none}
.t-SR .cback::before{animation:glw .5s .3s ease-in-out}
.t-SSR .cback::before,.t-UR .cback::before,.t-LR .cback::before{animation:glwOn 1s .3s ease-out forwards}
@keyframes glw{50%{opacity:.8}}@keyframes glwOn{to{opacity:1}}
.cback{will-change:transform}
.cback::after{content:"";position:absolute;inset:9px;border:1px solid color-mix(in srgb,var(--glow) 40%,transparent);border-radius:4%}
.cback span{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,10vw,46px);letter-spacing:.14em;color:color-mix(in srgb,var(--glow) 75%,var(--text))}
.tease .rl{position:absolute;bottom:-38px;font-family:var(--f-mono);font-weight:600;font-size:15px;letter-spacing:.3em;color:var(--glow);opacity:0;animation:rlIn .25s ease-out forwards}
.t-R .rl{animation-delay:.2s}.t-SR .rl{animation-delay:.55s}.t-SSR .rl{animation-delay:1s}.t-UR .rl{animation-delay:1.55s}.t-LR .rl{animation-delay:1.95s}
@keyframes tIn{from{transform:translateY(34px) scale(.86);opacity:0}}
@keyframes rlIn{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.t-SR .cback{animation:tIn .32s ease-out both,beat .5s .3s ease-in-out}
@keyframes beat{50%{transform:scale(1.04)}}
.t-SSR .cback{animation:tIn .32s ease-out both,lift .9s .3s cubic-bezier(.3,.7,.3,1) forwards,trem .07s 1s linear 4}
.t-UR .cback,.t-LR .cback{animation:tIn .45s ease-out both,lift 1.4s .4s cubic-bezier(.3,.7,.3,1) forwards,trem .06s 1.5s linear 6}
@keyframes lift{to{transform:translateY(-10px) scale(1.05)}}
@keyframes trem{50%{translate:2px -1px}}
.t-UR::before,.t-LR::before{content:"";position:fixed;inset:0;z-index:-2;background:#000;opacity:0;animation:dim 1.3s .2s forwards;pointer-events:none}
@keyframes dim{to{opacity:.6}}
.t-LR .cback{border-width:4px;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.18),transparent 60%),repeating-linear-gradient(45deg,#22232a 0 7px,#1a1b21 7px 14px)}
.mg{position:relative;width:min(70vw,280px)}.mg-base,.mg-scn{width:100%}.mg-scn{position:absolute;left:0;top:0;z-index:2;opacity:0;animation:mgIn 1.9s .5s cubic-bezier(.45,0,.3,1) forwards;filter:drop-shadow(0 0 18px #E3C27A)}
.mg-base{animation:mgBase .5s ease-out both}
.mg-fl{position:absolute;inset:0;z-index:3;border-radius:6%;background:#fff;opacity:0;pointer-events:none}.mg-fl.on{animation:flOut .6s ease-out}
@keyframes mgIn{0%{opacity:0;transform:translate(-58%,-38%) rotate(-14deg) scale(1.08)}22%{opacity:1;transform:translate(-24%,-26%) rotate(-8deg) scale(1.06)}58%{opacity:1;transform:translate(-24%,-26%) rotate(-8deg) scale(1.06)}84%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0;transform:translate(0,0) rotate(0) scale(1)}}
@keyframes mgBase{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.reveal-card.pre{animation:none;transform:perspective(900px) rotateY(88deg) scale(1.04)}

@keyframes flipIn{from{transform:perspective(900px) rotateY(88deg) scale(1.04)}to{transform:none}}
.reveal-card .fl{position:absolute;inset:0;z-index:3;border-radius:6%;background:#fff;opacity:0;pointer-events:none}
.reveal-card.flipin .fl{animation:flOut .38s ease-out}
@keyframes flOut{from{opacity:.55}to{opacity:0}}
.big-pack::after{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.32) 50%,transparent 60%);background-size:260% 100%;background-position:150% 0;animation:packShine 2.6s ease-in-out infinite;pointer-events:none;z-index:3}
@keyframes packShine{0%,55%{background-position:150% 0}100%{background-position:-60% 0}}

@keyframes beam{to{opacity:1;transform:scaleY(1.4)}}

@keyframes pulse{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

.mini-emb{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:5px;background:var(--p-ecl);color:var(--text);font-family:var(--f-mono);font-weight:600;font-size:9.5px}
.pk.tgt .pk-l{color:var(--text)}
.pk.tgt .pk-k{color:color-mix(in srgb,var(--text) 30%,transparent)}
/* bonneteau */
#bonn{display:flex;align-items:center;justify-content:center;background:var(--bg)}
#bonn[hidden],#ad[hidden]{display:none!important}
.bn-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;width:100%;max-width:420px;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.bn-table{--w:calc((min(92vw,400px) - 20px) / 3);position:relative;width:min(92vw,400px);height:calc(var(--w) * 1.4 + 30px)}
.bn{position:absolute;left:0;top:15px;width:var(--w);transform:translate(calc(var(--x) * (var(--w) + 10px)),var(--y,0px));transition:transform .3s cubic-bezier(.5,0,.3,1);perspective:900px;cursor:pointer}
.bn-3d{position:relative;aspect-ratio:5/7;transform-style:preserve-3d;transition:transform .45s ease}
.bn.down .bn-3d{transform:rotateY(180deg)}
.bn-f,.bn-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bn-b{transform:rotateY(180deg);border-radius:6%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:calc(var(--w) * .5);color:color-mix(in srgb,var(--text) 30%,transparent);background:radial-gradient(color-mix(in srgb,var(--ssr-light) 30%,transparent) 22%,transparent 24%) 0 0/6px 6px,linear-gradient(150deg,var(--p-ecl),var(--surface-2))}
.bn.miss{opacity:.45}
.bn.win .bn-f{filter:drop-shadow(0 0 14px var(--r-ssr))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:80;max-width:min(420px,calc(100% - 32px));padding:11px 16px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:700;font-size:13.5px;text-align:center;box-shadow:0 8px 24px color-mix(in srgb,var(--bg) 60%,transparent)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- La Tour Céleste : pagode de nuit, un étage = un toit ---------- */
.tw-stats{display:grid;grid-template-columns:1fr 1fr 1.2fr;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.tw-stats>div{padding:7px 12px;display:flex;flex-direction:column;gap:2px}.tw-stats>div+div{border-left:1px solid var(--line)}
.tw-stats b{font-family:var(--f-display);font-weight:900;font-weight:400;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}.tw-stats b small{font-size:13px;color:var(--muted)}.tw-stats b.sm{font-size:15px;padding-top:4px}
.tw-msg{border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;border:1px solid var(--line);background:var(--surface)}
.tw-msg.ko{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}.tw-msg.ok{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.tower{--lac:#B8322A;--lac-d:#7A1F1A;--tile:#232838;--tile-l:#3A4157;--lamp:#FFB648;position:relative;display:flex;flex-direction:column;align-items:center;padding:34px 10px 0;border-radius:18px;overflow:hidden;
  background:radial-gradient(1.5px 1.5px at 12% 8%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 30% 18%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 78% 6%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 88% 22%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 8% 34%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 92% 40%,#fff4 50%,transparent 51%),
  linear-gradient(180deg,#0A0D1A 0%,#141A30 55%,#1B2238 100%);border:1px solid var(--line)}
.tw-sky .moon{position:absolute;top:16px;right:22px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 38% 40%,#FFF4D8,#E8D4A2 60%,#B9A577);box-shadow:0 0 30px #FFE6A833}
.tw-spire{width:4px;height:30px;margin-bottom:-2px;background:repeating-linear-gradient(180deg,var(--accent) 0 3px,transparent 3px 6px);position:relative;z-index:1}
.tw-spire::before{content:'';position:absolute;top:-8px;left:50%;width:8px;height:8px;border-radius:50%;transform:translateX(-50%);background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tw-roof{width:calc(var(--w) + 6%);height:13px;position:relative;z-index:1;background:linear-gradient(180deg,var(--tile-l),var(--tile));clip-path:polygon(0 100%,3% 55%,9% 10%,12% 0,88% 0,91% 10%,97% 55%,100% 100%,94% 82%,6% 82%);margin-bottom:-1px}
.tw-st{width:var(--w);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;padding:7px 9px;text-align:left;position:relative;
  background:linear-gradient(180deg,#1C2134,#161A29);border-left:4px solid var(--lac-d);border-right:4px solid var(--lac-d);min-height:52px}
.tw-st::after{content:'';position:absolute;inset:auto 0 0 0;height:2px;background:color-mix(in srgb,var(--lac-d) 60%,transparent)}
.tw-pl{width:24px;padding:4px 0;display:grid;place-items:center;font-family:'Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif;font-weight:700;font-size:15px;color:#F4E3C1;background:linear-gradient(180deg,#5A3A22,#3E2717);border:1px solid #8A6440;border-radius:3px}
.tw-b{display:flex;flex-direction:column;min-width:0}.tw-b b{font-weight:900;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-b small{font-size:11px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-r{display:flex;align-items:center;gap:6px}.tw-rw{display:flex;align-items:center;gap:4px}.tw-rw .pk{width:22px}.tw-rw .coin{width:13px;height:13px}.tw-rw em{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--accent)}
.trophy:has(.bigcoin){display:grid;place-items:center;aspect-ratio:1}
.bigcoin{position:relative;width:46%;height:auto;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--accent) 55%,#B88A12);box-shadow:inset 0 0 0 7px #0002,0 10px 30px #0006;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}.bigcoin span{font-family:var(--f-display);font-weight:900;font-size:38px;color:#6B4C06}
.tw-st.lock{opacity:.5}.tw-st.lock .tw-b small{opacity:.8}
.tw-st.done{background:linear-gradient(180deg,#1A1F2F,#151927)}.tw-st.done .tw-b b{color:var(--muted)}
.tw-seal{width:26px;height:26px;display:grid;place-items:center;border-radius:5px;transform:rotate(-8deg);font-family:'Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif;font-weight:700;font-size:15px;color:#FFE9DF;background:var(--lac);box-shadow:inset 0 0 0 2px #FFD3C455}
.tw-st.new .tw-seal{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
.tw-st.cur{border-color:var(--lac);background:radial-gradient(120% 140% at 50% 120%,color-mix(in srgb,var(--lamp) 34%,transparent),transparent 60%),linear-gradient(180deg,#262B40,#1D2234);box-shadow:0 0 0 1px color-mix(in srgb,var(--lamp) 40%,transparent),0 0 22px color-mix(in srgb,var(--lamp) 22%,transparent)}
.tw-st.cur .tw-pl{background:linear-gradient(180deg,#C8902E,#8A5E1A);color:#2A1A06;border-color:#F3C86A}
.tw-go{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;padding:4px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);animation:bob 1.6s ease-in-out infinite}
.tw-st.boss .tw-b b{font-family:var(--f-display);font-weight:900;font-weight:400;letter-spacing:.02em}
.tw-st.boss:not(.done){border-left-color:#5B2A8A;border-right-color:#5B2A8A}
.tw-base{width:100%;margin-top:0;padding:12px 10px 14px;text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);
  background:linear-gradient(180deg,#2A3046,#1E2335);border-top:3px solid #3A4157;clip-path:polygon(4% 0,96% 0,100% 100%,0 100%)}
.tw-cmp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}.tw-cmp div{display:flex;flex-direction:column;gap:2px}.tw-cmp b{font-family:var(--f-display);font-weight:900;font-weight:400;font-size:30px;line-height:1}.tw-cmp small{font-size:11px;color:var(--muted)}
.tw-weak{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}.tw-weak>div{display:flex;flex-direction:column;gap:2px}
.tw-wk{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;font-family:'Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif;font-weight:700;font-size:19px;color:#FFE9DF;background:var(--band)}
@media (prefers-reduced-motion:reduce){.tw-go{animation:none}}

/* éveil : autel (case vide + conditions) */
.awk-altar{display:grid;grid-template-columns:42% 1fr;gap:14px;align-items:start;padding:14px;border-radius:16px;background:radial-gradient(90% 70% at 25% 30%,color-mix(in srgb,#6C4BE0 22%,transparent),transparent 70%),var(--surface);border:1px solid var(--line)}
.awk-slot{width:100%;aspect-ratio:5/7;border-radius:12px;border:2px dashed color-mix(in srgb,#9B7BFF 55%,var(--line));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:8px}
.awk-slot span{font-family:'Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif;font-weight:700;font-size:44px;color:color-mix(in srgb,#9B7BFF 60%,transparent);line-height:1}
.awk-slot small{font-size:11px;color:var(--muted);line-height:1.3}
.awk-slot.on{border:0;padding:0;display:block;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
.awk-cond{display:flex;flex-direction:column;gap:8px;min-width:0}.awk-cond>b{font-weight:900;font-size:16px;line-height:1.2}
.awk-need{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.awk-need li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);font-size:13px}
.awk-need li span{display:flex;align-items:center;gap:6px;color:var(--muted)}.awk-need li b{font-family:var(--f-mono);font-size:13px}
.awk-need li.ok{border-color:color-mix(in srgb,var(--good) 60%,var(--line))}.awk-need li.ok b{color:var(--good)}
.awk-tab{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.awk-tab li{display:grid;grid-template-columns:38px 1fr 1fr;align-items:center;font-size:12px;padding:3px 0;border-bottom:1px solid var(--line)}
.awk-tab li span{font-family:var(--f-display);font-weight:900;font-size:12px}.awk-tab em{font-style:normal;font-family:var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:4px}
.cw.awk-picked{outline:2px solid #9B7BFF;outline-offset:3px;border-radius:10px}
.btn.sm{padding:7px 12px;font-size:12.5px}

/* initiation + onglets verrouillés */
.init{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.init-top{display:flex;justify-content:space-between;align-items:baseline}
.init-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.init-bar i{height:5px;border-radius:3px;background:var(--line)}.init-bar i.on{background:var(--good)}.init-bar i.cur{background:var(--accent)}
.init-t{font-weight:900;font-size:16px;line-height:1.25}
.init-rw{display:flex;align-items:center;gap:8px;font-size:13px}.init-rw .pk{width:22px}
nav.tabs button.locked{opacity:.35}
.pk.bienv{--pc:var(--p-bienv)}

/* équipe v72 : tient dans l'écran */
.tm{position:relative;display:flex;flex-direction:column;gap:8px;height:var(--mh,640px);min-height:420px;margin-bottom:18px}
.tm-top{display:flex;flex-direction:column;gap:6px;flex:none}
.tsel button{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.15;padding:5px 4px}
.tsel button small{font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--muted)}
.tm-sc{display:flex;align-items:stretch;gap:6px}
.tm-sc>*{display:flex;align-items:baseline;gap:4px;padding:5px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);white-space:nowrap}
.tm-sc i{font-style:normal;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tm-sc b{font-family:var(--f-display);font-weight:900;font-size:17px;line-height:1;font-variant-numeric:tabular-nums}
.tm-sc small{font-size:11px;color:var(--muted)}
.tm-f{flex:1;min-width:0;color:var(--text);text-align:left;overflow:hidden}
.tm-f b{font-family:inherit;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis}.tm-f .chev{margin-left:auto;color:var(--muted);font-size:11px}
.tm-f[aria-expanded="true"]{border-color:var(--accent)}
.tm .team-pitch{flex:1;min-height:0;display:flex}
.tm .pitch{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;gap:4px;padding:8px 6px;perspective:1100px}
.tm .prow{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;gap:8px}
.tm .slot,.tm .pitch .prow .slot{position:relative;width:auto;max-width:none;height:100%;gap:3px;justify-content:center}
.tm .slot .card,.tm .slot .empty{height:calc(100% - 13px);width:auto;max-width:calc((100vw - 80px)/3);aspect-ratio:5/7;flex:none}
@media (min-width:700px){.tm .slot .card,.tm .slot .empty{max-width:150px}}
.tm .slot .lbl{display:none}
.tm .slot .lbl.off{display:block;position:absolute;top:44%;left:50%;transform:translateX(-50%);z-index:3;padding:2px 5px;border-radius:5px;background:var(--bad);color:#fff;font-size:8.5px;white-space:nowrap}
.tm .slot .pips{height:10px}
/* relief des cartes */
.tm .slot .card{border-radius:9px;transform:translateY(-3px) rotateX(4deg);transform-origin:50% 100%;box-shadow:0 14px 16px -8px rgba(0,0,0,.75),0 4px 6px -2px rgba(0,0,0,.5);transition:transform .18s ease,box-shadow .18s ease}
.tm .slot .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:4;background:linear-gradient(155deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.04) 28%,transparent 45%,rgba(0,0,0,.18) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.35)}
.tm .slot:active .card{transform:translateY(0) rotateX(0);box-shadow:0 5px 8px -4px rgba(0,0,0,.7)}
.tm .slot .empty{border-radius:9px;box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
/* onglet latéral + volet formations */
.ftab{position:absolute;right:calc(-1 * var(--gutter,16px));top:46%;z-index:6;width:22px;padding:12px 0;border-radius:10px 0 0 10px;border:1px solid var(--line);border-right:0;background:var(--surface);color:var(--text);box-shadow:-4px 4px 12px rgba(0,0,0,.35)}
.ftab span{display:block;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.fp-bg{display:none}
.fpanel{position:absolute;top:84px;right:calc(-1 * var(--gutter,16px));z-index:8;width:min(230px,70vw);display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-right:0;border-radius:14px 0 0 14px;background:var(--surface);box-shadow:-10px 10px 30px rgba(0,0,0,.5);transform:translateX(105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.fp-on .fpanel{transform:none;visibility:visible;transition:transform .22s ease}
.fp-on .fp-bg{display:block;position:absolute;inset:-20px calc(-1 * var(--gutter,16px));z-index:7}
.fp-on .ftab{opacity:0;pointer-events:none}
.fms{display:flex;flex-direction:column;gap:6px}
.fm{display:flex;align-items:center;gap:10px;padding:7px 9px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-align:left}
.fm svg{width:26px;height:36px;flex:none;fill:var(--muted)}
.fm span{display:flex;flex-direction:column}.fm b{font-size:13px}.fm small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.fm[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}.fm[aria-pressed="true"] svg{fill:var(--accent)}
.fpanel .btn{width:100%}
@media (min-width:900px){.ftab{right:0}.fpanel{right:0}}

/* v73 : ouverture — les cartes sortent du booster ; lueur de rareté sur les SSR, UR et LR */
.fly{position:absolute;left:50%;top:6%;width:78%;aspect-ratio:5/7;margin-left:-39%;z-index:5;pointer-events:none}
.fc{position:absolute;inset:0;border-radius:7%;display:grid;place-items:center;background:repeating-linear-gradient(45deg,#1b2033 0 7px,#151a2a 7px 14px);border:1.5px solid color-mix(in srgb,var(--text) 22%,transparent);box-shadow:0 8px 16px rgba(0,0,0,.55);opacity:0;transform:translateY(30%) scale(.86);animation:flyUp .75s cubic-bezier(.2,.9,.25,1) forwards;animation-delay:calc(.22s + var(--i) * .09s)}
.fc b{font-family:var(--f-display);font-weight:900;font-weight:400;font-size:clamp(12px,4vw,18px);letter-spacing:.14em;color:color-mix(in srgb,var(--text) 45%,transparent)}
.fc.hi{border-color:var(--rc);box-shadow:0 0 0 1px var(--rc),0 0 22px 5px color-mix(in srgb,var(--rc) 75%,transparent),0 8px 16px rgba(0,0,0,.55)}
.fc.hi b{color:var(--rc)}
.fc.hi::after{content:"";position:absolute;inset:-2px;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,color-mix(in srgb,var(--rc) 55%,#fff) 50%,transparent 70%);background-size:250% 100%;mix-blend-mode:screen;animation:fcShine 1.1s .9s ease-in-out infinite}
@keyframes flyUp{0%{opacity:0;transform:translateY(30%) scale(.86)}25%{opacity:1}100%{opacity:1;transform:translate(calc(var(--o) * 30%),calc(-82% - (2 - var(--o) * var(--o)) * 4%)) rotate(calc(var(--o) * 8deg)) scale(.62)}}
@keyframes fcShine{from{background-position:120% 0}to{background-position:-120% 0}}
#rvQ{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:1000;display:flex;gap:6px;pointer-events:none}
#rvQ i{width:14px;height:20px;border-radius:3px;background:repeating-linear-gradient(45deg,#1b2033 0 3px,#151a2a 3px 6px);border:1px solid color-mix(in srgb,var(--text) 25%,transparent);transition:opacity .2s,transform .2s}
#rvQ i.done{opacity:.25}
#rvQ i.cur{border-color:var(--text);transform:translateY(-3px)}
#rvQ i.hi{border-color:var(--rc);box-shadow:0 0 10px 2px color-mix(in srgb,var(--rc) 80%,transparent);animation:qPulse 1.2s ease-in-out infinite}
@keyframes qPulse{50%{box-shadow:0 0 16px 4px color-mix(in srgb,var(--rc) 90%,transparent)}}
@media (prefers-reduced-motion:reduce){.fc{animation-duration:.01s}.fc.hi::after,#rvQ i.hi{animation:none}}

/* v74 : vue PC (écran large) — navigation à gauche, contenu sur toute la largeur */
.packs{display:flex;flex-direction:column;gap:12px}
@media (min-width:1024px){
  .app{max-width:1320px;display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .top-bar{grid-column:1/-1}
  nav.tabs{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:4px;padding:18px 12px;border-top:0;border-right:1px solid var(--line)}
  nav.tabs button,nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;border-radius:10px;font-size:14px;letter-spacing:.01em}
  nav.tabs button svg{width:20px;height:20px}
  nav.tabs button[aria-current="page"]{background:var(--surface)}
  nav.tabs button .dot{top:50%;left:auto;right:12px;transform:translateY(-50%)}
  main{grid-column:2;grid-row:2;padding:26px 36px 48px}
  .grid3,.sum{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .cfil{flex-direction:row;flex-wrap:wrap;align-items:center}.csearch{flex:1 1 340px}.cfil-r{flex-direction:row;align-items:center;flex:1 1 520px}.csort select{min-width:220px}
  .packs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .packs .pack-row{grid-template-columns:1fr;justify-items:center;text-align:center}.packs .pack-row .pk{width:96px}.packs .pack-row .info{display:flex;flex-direction:column;align-items:center;gap:8px}

function evalTeam(rows,ids){
  const sl=rows.flat();const cards=sl.map((p,i)=>ids[i]&&CARD[ids[i]]?CARD[ids[i]]:null);
  const inPos=cards.map((c,i)=>!!c&&c.poste===sl[i]);const mc={},cc={};
  cards.forEach((c,i)=>{if(c&&inPos[i]){mc[c.m]=(mc[c.m]||0)+1;cc[c.cl]=(cc[c.cl]||0)+1}});
  const parts=cards.map(()=>[0,0]);
  const tc={};if(typeof OPT!=='undefined'&&OPT.TAGLINK)cards.forEach((c,i)=>{if(c&&inPos[i])c.tags.forEach(t=>tc[t]=(tc[t]||0)+1)});
  const pts=cards.map((c,i)=>{if(!c||!inPos[i])return 0;const n=mc[c.m],k=cc[c.cl];const a=n>=4?3:n===3?2:n===2?1:0;const b=k>=5?2:k>=3?1:0;const g=(typeof OPT!=='undefined'&&OPT.TAGLINK&&c.tags.some(t=>tc[t]>=3))?1:0;parts[i]=[a,b,g];return Math.min(3,a+b+g)});
  const notes=cards.map(c=>c?c.note:0);
  return{sl,cards,inPos,pts,parts,notes,chem:pts.reduce((a,b)=>a+b,0),max:sl.length*3,note:Math.round(notes.reduce((a,b)=>a+b,0)/sl.length),filled:cards.filter(Boolean).length};
}

const PORD=['Tank','DPS','Distance','Soutien'];
/* La formation suit la condition : on répartit les cases selon les postes où vivent les cartes qui la remplissent */
function rowsFor(filter,n){
  const cnt={};BASE.filter(filter).forEach(c=>cnt[c.poste]=(cnt[c.poste]||0)+1);
  const as={};for(let i=0;i<n;i++){let best=null,bv=-1;Object.keys(cnt).forEach(p=>{const v=cnt[p]/((as[p]||0)+1);if(v>bv&&(as[p]||0)<cnt[p]){bv=v;best=p}});if(!best)break;as[best]=(as[best]||0)+1}
  return PORD.filter(p=>as[p]).map(p=>Array(as[p]).fill(p));
}

    {id:'dt-'+k,daily:true,cat:'jour',need:{f:tF,k:2,lbl:'['+tg+']'},n:'Tag du jour : ['+tg+']',em:'#',rows:rowsFor(tF,3),rw:{pack:'bronze',coins:200},

/* deux systèmes : RAPIDE (n cartes qui remplissent une condition, sans formation) et FORMATION (terrain, postes, chemistry) */
function sbcQuick(x){return !!(x.fodder||x.cat==='duo')}
/* faisable ? on regarde ta collection (cartes non verrouillées), puis on essaie une composition simple */
function sbcPoolAll(x){const keep=x.keep1?1:0,out=[];Object.keys(S.owned).forEach(id=>{const c=CARD[id];if(!c||c.scn||S.locked[id]||!x.ok(id))return;for(let i=0;i<(S.owned[id]||0)-keep;i++)out.push(c)});return out.sort((a,b)=>b.note-a.note)}
function sbcFill(x,pool){const sl=x.rows.flat(),ids=sl.map(()=>null),left=pool.slice(),pick=[],nd=x.need;
  const take=c=>{const i=left.indexOf(c);if(i>=0){left.splice(i,1);pick.push(c)}};
  if(x.duo)x.duo.forEach(a=>{const c=left.find(c=>c.nom===a);if(c)take(c)});
  if(nd){if(nd.w){const seen=new Set();left.filter(nd.f).forEach(c=>{if(!seen.has(c.m)&&seen.size<nd.w){seen.add(c.m);take(c)}})}
    while(pick.filter(nd.f).length<nd.k){const c=left.find(nd.f);if(!c)break;take(c)}}
  pick.slice(0,sl.length).forEach(c=>{let i=sl.findIndex((p,j)=>!ids[j]&&p===c.poste);if(i<0)i=ids.findIndex(v=>!v);ids[i]=c.id});
  const mc={};pick.forEach(c=>mc[c.m]=(mc[c.m]||0)+1);const dom=Object.keys(mc).sort((a,b)=>mc[b]-mc[a])[0];
  sl.forEach((p,j)=>{if(ids[j])return;let best=null,bv=-1;left.forEach(c=>{const v=(c.poste===p?1000:0)+(c.m===dom?200:0)+c.note;if(v>bv){bv=v;best=c}});if(best){left.splice(left.indexOf(best),1);ids[j]=best.id}});
  return ids}

  const n=x.rows.flat().length,pool=sbcPoolAll(x),nd=x.need;let miss=Math.max(0,n-pool.length);
  if(x.duo)miss=Math.max(miss,x.duo.filter(a=>!pool.some(c=>c.nom===a)).length);
  if(nd){const mt=pool.filter(nd.f);miss=Math.max(miss,nd.k-mt.length);if(nd.w)miss=Math.max(miss,nd.w-new Set(mt.map(c=>c.m)).size)}
  if(miss>0)return{s:'miss',n:miss};
  const t=evalTeam(x.rows,sbcFill(x,pool));return{s:x.conds.every(c=>c[1](t))?'ok':'try'}}

/* ---------- moteur de combat par stats ----------
   Qui commence : tirage, chance = VIT² / (VIT² + VIT adverse²), VIT réelle (chemistry comprise).
   Le premier, s'il est plus rapide, peut placer un 2e coup à 40 % des dégâts, une seule fois par duel (chance à chaque échange selon l'écart, 30 % max).
   Dégâts = ATT × ATT / (ATT + DEF), ±30 %. TEC : critique (TEC ÷ 2,5 %), dégâts ×2. POU : attaque spéciale au 2e échange.

const PERF={on:false,last:''};
function perfInfo(){let gpu='?';try{const c=document.createElement('canvas').getContext('webgl');const d=c&&c.getExtension('WEBGL_debug_renderer_info');gpu=d?c.getParameter(d.UNMASKED_RENDERER_WEBGL):(c?'WebGL sans détail':'pas de WebGL')}catch(e){}
  return {gpu,cores:navigator.hardwareConcurrency||'?',mem:navigator.deviceMemory||'?',frame:window.top!==window.self?'dans Claude (cadre)':'page seule',ua:(navigator.userAgent.match(/(Chrome|Firefox|Safari|Edg)\/[\d.]+/g)||[]).join(' '),scr:innerWidth+'×'+innerHeight+' ×'+devicePixelRatio}}
function perfStart(){if(PERF.on)return;PERF.on=true;const F=[];let l=performance.now(),t0=l;let lt=0,ltMax=0;let po=null;
  try{po=new PerformanceObserver(x=>x.getEntries().forEach(e=>{lt++;ltMax=Math.max(ltMax,e.duration)}));po.observe({type:'longtask',buffered:false})}catch(e){}
  const tick=n=>{F.push(n-l);l=n;if(n-t0<45000)requestAnimationFrame(tick);else end()};requestAnimationFrame(tick);
  const end=()=>{PERF.on=false;if(po)po.disconnect();const f=F.slice(1).filter(x=>x<3000),s=f.slice().sort((a,b)=>a-b);const avg=f.reduce((a,b)=>a+b,0)/f.length;
    const j=f.filter(x=>x>50).length,big=f.filter(x=>x>200).length,inf=perfInfo();
    const verdict=big>3||j/f.length>.05?'saccadé':j/f.length>.015?'quelques à-coups':'fluide';
    PERF.last=`<b>Résultat : ${verdict}</b><span>${Math.round(1000/avg)} images/s en moyenne · ${(j/f.length*100).toFixed(1)} % d'images lentes · ${big} gel(s) &gt; 0,2 s · pire ${Math.round(s[s.length-1])} ms · tâches longues ${lt} (max ${Math.round(ltMax)} ms)</span><span>Carte graphique : ${inf.gpu}</span><span>${inf.cores} cœurs · ${inf.mem} Go · ${inf.ua} · ${inf.scr} · ${inf.frame}</span>`;
    toast('Mesure terminée : '+verdict+'. Résultat dans les outils de test.')};
  toast('Mesure lancée pendant 45 s : ouvre des boosters et une scène iconique.')}
['gesturestart','gesturechange','gestureend'].forEach(g=>document.addEventListener(g,e=>e.preventDefault()));

if(/[?&#]test\b/.test(location.href))setTimeout(openAdmin,400);
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f)f(t.dataset.v,t,e)});

document.addEventListener('keydown',e=>{const tg=e.target;if(/^[1-7]$/.test(e.key)&&innerWidth>=1024&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!(tg&&(tg.tagName==='INPUT'||tg.tagName==='SELECT'||tg.tagName==='TEXTAREA'))&&$('#sheet').hidden&&$('#cm').hidden&&$('#reveal').hidden){const b=document.querySelectorAll('nav.tabs button[data-act=tab]')[+e.key-1];if(b){b.click();return}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#cm').hidden)$('#cm').hidden=true;else if(!$('#sheet').hidden)closeSheet()}});

/* ---------- démarrage ---------- */
function start(d){
  const saved=(d&&typeof d.coins==='number')?d:load();
  if(saved){S=Object.assign(fresh(),saved);if(!Array.isArray(S.team)||S.team.length!==7)S.team=[null,null,null,null,null,null,null];if(!S.login)S.login={last:null,idx:-1}}
  if(saved&&saved.xp==null){S.xp=LV[4];S.init={done:true}}['owned','seen','locked','awkDone'].forEach(k=>{if(S[k])Object.keys(S[k]).forEach(id=>{if(!CARD[id])delete S[k][id]})});if(!FORMS[S.form])S.form='lance';cleanTeam();S.tab='home';i18nInit();render();setTimeout(warmArt,800);
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??null);
